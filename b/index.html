<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=1.0, user-scalable=0">
  <title>高人有术四柱八字智能排盘</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="seal">命</div>
    <div>
      <h1>四柱八字 · 智能排盘</h1>
      <p class="subtitle">高人有术 · 洞悉命理</p>
    </div>
  </header>

  <section class="card panel">
    <div class="field-head">
      <span class="field-title">出生信息</span>
      <span class="field-desc">输入出生日期时间，自动排出八字命盘</span>
    </div>
    <textarea id="birthday" placeholder="例如：199908121700（1999年8月12日17点）"></textarea>
    <div class="format-row">
      <span class="fmt"><i>阳历</i>199908121700</span>
      <span class="fmt"><i>阴历</i>1999&nbsp;&nbsp;&nbsp;8&nbsp;12&nbsp;1700</span>
      <span class="fmt"><i>闰月</i>1999&nbsp;8&nbsp;12&nbsp;1700</span>
    </div>
    <div class="options">
      <div class="opt-group">
        <span class="opt-label">性别</span>
        <label class="chip"><input id="gender_man" type="radio" name="gender" value="+" checked><span>男</span></label>
        <label class="chip"><input id="gender_woman" type="radio" name="gender" value="-"><span>女</span></label>
      </div>
      <div class="opt-group">
        <span class="opt-label">历法</span>
        <label class="chip"><input type="checkbox" id="lunar"><span>阴历</span></label>
      </div>
      <div class="opt-group">
        <span class="opt-label">子时流派</span>
        <label class="chip"><input id="zi0" type="radio" name="zi" value="2"><span>当日明时</span></label>
        <label class="chip"><input id="zi1" type="radio" name="zi" value="1" checked><span>明日明时</span></label>
      </div>
      <button id="start_btn" type="button"><span class="btn-icon">✦</span>开始排盘</button>
    </div>
    <div class="tip">
      <b>使用说明</b><br>
      1. 录入一段日期信息到框中，如 <code>199908121700</code> 代表1999年8月12日17点。<br>
      2. 三个连续空格表示阴历。<br>
      3. 月前有空格表示闰月，非闰月不生效。<br>
      4. 时间跨度支持：0001(庚申年)至9999(己亥年)。
    </div>
  </section>

  <section class="card result" id="pan" aria-live="polite"></section>

  <footer class="foot">四柱八字智能排盘 · 结果仅供参考娱乐</footer>
</div>
<script src="lunar.js"></script>

<script src="data.js"></script>
<script src="shensha-rules.js"></script>
<script src="main.js"></script>
</body>
</html>
